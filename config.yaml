# Every design choice in one place. Change a value here, not in the code,
# and record the reason in docs/design-decisions.md (quality gate 3).
# Values marked "not in design-decisions.md" come from the exploration
# notebook and still need to be agreed and logged there.

seed: 42

universe:
  benchmark: SPY
  tradable: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, QQQ, IWM]

data:
  start: "2000-01-01"
  end: "2026-06-30"
  raw_dir: data/raw
  processed_dir: data/processed
  # FRED id -> column name used in the pipeline
  fred_series:
    DTB3: DTB3            # 3-month T-bill, % p.a.
    VIXCLS: VIX           # CBOE VIX close
    T10Y3M: TERM_SPREAD   # 10Y minus 3M yield spread
  fred_lag_days: 1        # macro values known at t are those published for t-1

features:
  # Each ETF enters once its longest indicator (252 days) has a value,
  # which puts IWM's first row in May 2001.
  sample_start: "2001-01-01"
  sma_windows: [10, 20, 50, 200]
  macd: {fast: 12, slow: 26, signal: 9}
  adx_window: 14
  return_windows: [5, 21, 63, 126, 252]
  rsi_window: 14
  stochastic: {k: 14, d: 3}
  williams_window: 14
  roc_window: 10
  realized_vol_windows: [21, 63]
  atr_window: 14
  bollinger: {window: 20, n_std: 2}
  obv_change_window: 20
  volume_z_window: 20
  cmf_window: 20
  mfi_window: 14
  vix_change_window: 5
  benchmark_return_window: 21

label:
  horizon_days: 5         # holding period in trading days
  execution_lag_days: 1   # decide at close t, trade at close t+1
  decision_frequency: weekly   # last trading day of each week

splits:
  first_test_year: 2008
  last_test_year: 2026
  validation_months: 12   # last 12 months of each training window
  embargo_days: 5         # gap between blocks = execution lag + horizon + embargo = 11 days

models:
  # DRAFT (design-decisions.md, "decisions before Step 3"): values from the prototype
  refit_on: train               # final model fitted on training block only; validation for tuning, early stopping, p90
  calibration: analysis_only    # Brier score and calibration table; raw probabilities drive the signal
  # Supervisor, Oct 2026: LASSO and LightGBM selection fits pick features;
  # all three forecasting models are fitted on the union of the two selections.
  forecast_inputs: union
  lasso:
    C_grid: [0.002, 0.005, 0.01, 0.05, 0.1]   # selection fit and forecasting fit (re-tuned on the union)
    selection_metric: log_loss  # on validation
    forecast_penalty: l1        # DRAFT, to confirm: l1 (may zero union features) or l2 (keeps all)
  lightgbm:
    top_n_features: 15          # selection fit only; forecasting fit uses the union
    importance: gain
    params:                     # fixed, no grid
      n_estimators: 2000
      learning_rate: 0.02
      num_leaves: 15
      min_child_samples: 200
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_lambda: 1.0
    early_stopping_rounds: 100
  lstm:
    sequence_length: 20
    layers: 1
    units: 32
    dropout: 0.2                # after the LSTM layer
    recurrent_dropout: 0.0
    learning_rate: 0.001
    batch_size: 512
    max_epochs: 25
    early_stopping_patience: 3

signals:
  # Main: s = min(1, max(0, (p - b) / (p90 - b)))
  #   b   = share of positive labels in the training window
  #   p90 = this quantile of the model's validation forecasts
  main: scaled
  p90_quantile: 0.90
  floor: 0.01             # stay flat for the whole window if p90 - b < floor
  sensitivity:
    - base_rate_centred   # (p - b) / (1 - b)
    - linear              # 2p - 1

portfolio:
  vol_target: 0.10
  vol_lookback_days: 63
  max_weight: 0.25
  max_leverage: 1.0
  long_only: true
  no_trade_band: 0.02
  no_trade_band_applies_to: per_etf   # DRAFT
  cost_bps_per_side: 5
  benchmarks_pay_costs: true          # DRAFT; buy-and-hold pays the initial purchase only
  cost_bps_sensitivity: [0, 2, 5, 10]
  cash_rate: DTB3
  benchmarks:
    - spy_buy_hold
    - equal_weight_monthly
    - vol_target_spy
    - sma_50_200
    - always_on

stats:
  bootstrap: {method: stationary, n_resamples: 10000, block_days: 20}
  # Listed in docs/architecture.md for the draft stage; not in design-decisions.md
  other_tests: [ledoit_wolf_2008, deflated_sharpe, diebold_mariano]
  # DRAFT (design-decisions.md, "decisions before Step 3")
  significance_level: 0.05
  alternative: one_sided
  deflated_sharpe_trials: 9     # 3 models x 3 signal versions

subperiods:                     # DRAFT
  break_2018: "2018-09-24"      # GICS reclassification / XLC launch
  crises:
    gfc: ["2008-09-01", "2009-06-30"]
    covid: ["2020-02-01", "2020-06-30"]
    rate_shock_2022: ["2022-01-01", "2022-10-31"]

run:
  quick_mode: false       # true: synthetic prices, short sample, small grids
  results_dir: results
